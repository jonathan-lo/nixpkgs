# session managment via sesh
# The opening view aggregates open workmux worktrees, the remaining tmux
# sessions, this config and gh-repos (scripts/sesh-default-list.sh); ^a restores
# the plain `sesh list`, ^o lists every workmux worktree on the machine, open or
# closed. `sesh-connect` resolves the selection: worktree paths go to
# `workmux open` so they come back with their pane layout, gh-repos entries
# (owner/name) are cloned into ~/code/github and connected to, everything else
# is passed to sesh.
#
# Worktree rows are `<display><TAB><session><TAB><path>`: --with-nth shows only
# the display column (and limits matching to it) while --accept-nth makes fzf
# return only the path. Every other source emits tab-free lines, which are a
# single field, so both expressions are the identity there.
#
# The `\t` reaches fzf as the two characters backslash-t: tmux leaves it alone
# inside the single quotes, and so does the shell. That is correct, because
# --delimiter is a *regex* -- do not "helpfully" replace it with a real tab or
# double the backslash.
bind-key j run-shell "sesh-connect \"$(
  sesh-default-list | fzf-tmux -p 55%,60% \
    --no-sort --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^r repos ^o worktrees ^q tmux kill ^f find' \
    --delimiter '\t' --with-nth '{1}' --accept-nth '{-1}' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-j:down,ctrl-k:up' \
    --bind 'ctrl-d:half-page-down,ctrl-u:half-page-up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t)' \
    --bind 'ctrl-r:change-prompt(🐙  )+reload(gh-repos)' \
    --bind 'ctrl-o:change-prompt(🌳  )+reload(workmux-worktrees)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-q:execute(tmux kill-session -t {})+change-prompt(⚡  )+reload(sesh list)'
)\""
