# workmux dashboard: monitor every AI agent across worktrees, with live preview,
# input mode, worktree/PR view, and sweep. Needs the status-tracking hooks in
# claude/settings.public.json so agents register.
bind-key u display-popup -E -w 90% -h 90% "workmux dashboard"

# workmux add: prompt for a branch/worktree name on the status line, then create
# the worktree + its own tmux session (session mode) and switch the client to it.
# Runs in a throwaway window (not a popup or run-shell) so workmux inherits the
# attached client and can switch-client into the new session; the temp window
# closes when workmux exits. workmux-add wraps `workmux add`, naming the session
# <root-repo>-<name> (see tmux scripts/workmux-add.sh).
bind-key y command-prompt -p "worktree name:" "new-window -c '#{pane_current_path}' 'workmux-add %1'"

# workmux last-done: jump to the most recently completed or waiting agent. Press
# again to cycle through older agents in reverse chronological order.
# https://workmux.raine.dev/reference/commands/last-done#tmux-keybinding
bind-key b run-shell "workmux last-done"
